note: >-
  Every candidate tool is a READ against an anonymously reachable operation, which is why a bridge
  would be trivial to build and why its absence is notable rather than excusable: the status API in
  particular is exactly the shape an agent wants and needs no credential at all. Write operations
  are deliberately excluded from this candidate list — they require a WordPress application password
  on Employ's own CMS, have no idempotency mechanism (see conventions/), and no published retention
  window for trashed records, so exposing them to an agent would be unsafe.
