name: Employ Inc MCP candidate
description: >-
  Employ, Inc. publishes NO MCP server. This is a CANDIDATE tool list derived from the operations
  its own contracts already expose, recorded so the gap is measurable. Nothing here is deployed and
  no endpoint below exists.
status: candidate
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: none
  verified: derived
search_evidence:
- query: Employ Inc MCP server / employinc.com mcp
  result: none
  note: >-
    No mcp.employinc.com host, no /mcp path on any Employ host, no MCP entry in any registry, and no
    mention of Model Context Protocol anywhere on employinc.com or in its llms.txt.
- url: https://www.employinc.com/.well-known/oauth-protected-resource
  status: 404
- url: https://www.employinc.com/.well-known/oauth-authorization-server
  status: 404
- url: https://www.employinc.com/wp-json/wp-abilities/v1/abilities
  status: 401
  note: >-
    The closest thing to an agent surface on this site. WordPress's Abilities API — the registry
    that exposes site capabilities to agents — IS registered in the discovery document under the
    wp-abilities/v1 namespace, but it returns HTTP 401 to an anonymous caller, so no capability can
    be enumerated. If Employ ever opened it, this is where an MCP bridge would read from.
