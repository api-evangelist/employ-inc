name: Employ Inc data model
description: >-
  The entity graph behind Employ, Inc.'s machine-readable surfaces. Three disconnected islands: the
  WordPress content graph, the Events Calendar graph that overlaps it, and the status graph on a
  separate host with no relationship to either.
