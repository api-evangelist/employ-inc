relationships:
- from: Post
  to: Category
  type: has_many
  via: categories[] (array of category ids)
- from: Post
  to: Tag
  type: has_many
  via: tags[] (array of tag ids)
- from: Post
  to: User
  type: belongs_to
  via: author (user id)
- from: Post
  to: Media
  type: has_one
  via: featured_media (media id)
- from: Page
  to: Page
  type: belongs_to
  via: parent (page id) — pages are hierarchical
- from: Page
  to: PageType
  type: has_many
  via: page-type[] (term ids)
- from: Resource
  to: Topic
  type: has_many
  via: topic[] (term ids)
- from: Resource
  to: ResourceType
  type: has_many
  via: resource_type[] (term ids)
- from: NewsItem
  to: NewsItemType
  type: has_many
  via: news_item_type[] (term ids)
- from: Category
  to: Category
  type: belongs_to
  via: parent (category id)
- from: Media
  to: Post
  type: belongs_to
  via: post (attachment parent id)
- from: Event
  to: Venue
  type: has_one
  via: venue (venue object or id)
- from: Event
  to: Organizer
  type: has_many
  via: organizer[] (organizer objects or ids)
- from: Event
  to: EventCategory
  type: has_many
  via: categories[]
- from: Event
  to: EventTag
