- from: Incident
  to: Page
  type: belongs_to
  via: page_id
id_conventions:
  wordpress: Sequential integers, scoped per site. Not stable across environments.
  events: >-
    Integer ids plus a human-readable slug; every Events Calendar collection is addressable by
    /by-slug/{slug} as well as /{id}, which makes slugs the safer client-side key.
  statuspage: Opaque 12-character lowercase alphanumeric strings, e.g. 5t2j43rsvdfx, 3sk7k3k1wlt3.
notes:
- >-
  The Events Calendar entities exist TWICE. tribe_events, tribe_venue and tribe_organizer are also
  registered as ordinary WordPress post types under /wp/v2, so the same underlying record is
  reachable through two contracts with two different serializations. The /wp/v2 view exposes the
  WordPress post envelope; the tribe/events/v1 view exposes the event-domain envelope with venue and
  organizer inlined. Neither contract mentions the other.
- >-
  And a third time: the tec/v1 namespace serves the same events, organizers and venues again under a
  newer contract. Three projections of one dataset, no crosswalk published.
- >-
  The status graph shares no identifier with anything on www.employinc.com. There is no join between
  a monitored component and any product, brand or content record.
