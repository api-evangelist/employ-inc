apis:
- aid: employ-inc:employ-inc-content-api
  name: Employ Inc Content API
  description: 'The WordPress REST API Employ, Inc. serves at www.employinc.com/wp-json/wp/v2. It exposes
    the Employ corporate site as JSON: blog posts, marketing and legal pages, media, the resource, case-study,
    news_item, glossary_terms and teams custom post types, the topic, resource_type, news_item_type and
    page-type taxonomies, and cross-content-type search. Reads on published content are anonymous; writes,
    /wp/v2/users and /wp/v2/comments require an authenticated WordPress application password.'
  humanURL: https://www.employinc.com/wp-json/
  baseURL: https://www.employinc.com/wp-json/wp/v2
