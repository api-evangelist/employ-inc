apis:
- aid: employ-inc:employ-inc-status-api
  name: Employ Inc Status API
  description: >-
    The public Atlassian Statuspage API on status.employinc.com. Eight anonymous endpoints report the
    rollup availability indicator, every monitored Employ platform component, the dated incident timeline
    with per-update affected-component transitions, and scheduled maintenance windows. This is the only
    Employ-operated API surface that requires no credential of any kind and the one an agent can poll
    today to answer "is Employ up".
  humanURL: https://status.employinc.com/
  baseURL: https://status.employinc.com/api/v2
