  - type: Examples
    url: examples/employ-inc-event-venues.json
  - type: Overlay
    url: overlays/employ-inc-events-calendar-rest-api-overlay.yaml
- aid: employ-inc:employ-inc-tec-events-rest-api
  name: Employ Inc TEC Events REST API
  description: The newer tec/v1 generation of The Events Calendar REST API on www.employinc.com, published
    as a self-describing OpenAPI 3.0.4 contract at its own /docs endpoint. Covers events, organizers and
    venues with full CRUD. It runs alongside the older tribe/events/v1 surface rather than replacing it,
    so both are recorded.
  humanURL: https://www.employinc.com/events/
  baseURL: https://www.employinc.com/wp-json/tec/v1
  tags:
  - Events
  - Venues
  - Calendar
  properties:
  - type: OpenAPI
    url: openapi/employ-inc-tec-events-rest-api-openapi.json
  - type: APIReference
    url: https://www.employinc.com/wp-json/tec/v1/docs
- aid: employ-inc:employ-inc-status-api
  name: Employ Inc Status API
  description: The public Atlassian Statuspage API on status.employinc.com. Eight anonymous endpoints
    report the rollup availability indicator, every monitored Employ platform component, the dated incident
    timeline with per-update affected-component transitions, and scheduled maintenance windows. This is
    the only Employ-operated API surface that requires no credential of any kind and the one an agent
    can poll today to answer "is Employ up".
  humanURL: https://status.employinc.com/
  baseURL: https://status.employinc.com/api/v2
  tags:
