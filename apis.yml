- aid: employ-inc:employ-inc-events-calendar-rest-api
  name: Employ Inc Events Calendar REST API
  description: The Events Calendar REST API (tribe/events/v1) for Employ, Inc. events and webinars, with
    a self-describing OpenAPI 3.0.0 contract the host publishes at its own /doc endpoint. Covers events,
    venues, organizers, event categories and event tags, each addressable by id or by slug. Read operations
    are anonymous; create, update and delete require an authenticated WordPress user.
  humanURL: https://www.employinc.com/events/
  baseURL: https://www.employinc.com/wp-json/tribe/events/v1
  tags:
  - Events
  - Webinars
  - Venues
  - Calendar
  properties:
  - type: OpenAPI
    url: openapi/employ-inc-events-calendar-rest-api-openapi.json
  - type: APIReference
