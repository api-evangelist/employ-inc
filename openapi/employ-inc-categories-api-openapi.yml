        schema:
          type: integer
        description: the event category term ID
        required: true
        name: id
      responses:
        '200':
          description: Returns the data of the event category with the specified term ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '400':
          description: The event category term ID is missing.
        '404':
