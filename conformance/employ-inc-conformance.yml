- id: scim
  conforms: false
  evidence: >-
    No SCIM schema URN, no /scim endpoint and no provisioning surface on any employinc.com host.
    Recorded because SCIM is the identity-provisioning standard an HR-technology buyer would look
    for; where it exists in this group it is implemented per ATS brand, not at the holding company.
- id: hr-open-standards
  conforms: false
  evidence: >-
    No HR Open Standards (HR-XML) message types, no HROS JSON schemas and no reference to the
    standard anywhere on employinc.com or in any of the four contracts.
  note: >-
    Reward-only check, recorded as a measured absence rather than a penalty. The recruiting sector's
    interoperability standards — HR Open Standards for candidate and requisition exchange, and
    schema.org/JobPosting for job distribution — are the ones worth probing for an ATS group, and
    neither appears at the Employ holding-company level.
- id: schema-org-jobposting
