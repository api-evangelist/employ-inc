name: Employ Inc conformance and compliance
description: >-
  Standards and regulatory regimes Employ, Inc. claims in its own published documents, and the
  technical conformance its contracts actually declare. Claims and contract evidence are kept apart
  on purpose: one is a legal commitment, the other is something an agent can verify.
conformance:
- id: soc2
  conforms: true
  evidence: >-
    https://www.employinc.com/security-exhibit/ section 1.2 Certification — "During the term of the
    Agreement, Employ shall maintain AICPA SOC2 certification or equivalent as well as maintain a
    lawful transfer mechanism for export of personal data out of the European Union."
  kind: contractual-commitment
  note: >-
    A contractual commitment to MAINTAIN SOC 2, not a published report or a dated audit letter. No
    report, period covered or auditor is named anywhere public, and there is no trust center to
    request one from.
- id: gdpr
  conforms: true
  evidence: >-
    https://www.employinc.com/dpa/ (GDPR Data Processing Addendum) and a pre-signed DPA at
    https://www.employinc.com/wp-content/uploads/2023/11/Employ-Inc-DPA-Presigned.pdf; the Security
    Exhibit commits to a lawful EU personal-data transfer mechanism.
  kind: published-policy
- id: ccpa-cpra
  conforms: true
  evidence: >-
    https://www.employinc.com/cpra-data-processing-addendum/ plus brand-specific CPRA DPAs for
    JazzHR, Lever and Jobvite linked from https://www.employinc.com/legal/.
  kind: published-policy
- id: nyc-local-law-144
  conforms: true
  evidence: >-
    Independent AI bias audit results published at
    https://trust.app.holisticai.io/public/nyc-bias-audit/org_01KJQ6J4PPV6486JHT73V975QB/1c98fa3f-8c19-4759-9e33-f8a649cc5bb6,
    linked from https://www.employinc.com/legal/ as "AI Bias Audit Results".
  kind: third-party-audit
  verified: link-only
  note: >-
    This is the domain-standard signal that matters most for an automated-employment-decision-tool
    vendor. New York City Local Law 144 requires an annual independent bias audit of any AEDT used
    to screen candidates, with a summary of results published. Employ publishes such a link, on its
    own legal page, pointing at Holistic AI as the independent auditor. VERIFIED TO THE LINK ONLY:
    the target returned HTTP 200 on 2026-09-13 but the body is a 510-byte JavaScript shell
    (<div id="root"></div>, title "Holistic AI Platform") that renders client-side, so the audit
    date, the impact ratios and the selection rates were NOT read. What is established is that
    Employ publishes an independent bias-audit link; what the audit concludes is not asserted here.
- id: annual-penetration-testing
  conforms: true
  evidence: >-
    https://www.employinc.com/security-exhibit/ section 1.3 Testing — "Employ will conduct at least
    annual third-party security tests on applications and infrastructure used to support the
    provision of Services and Support to identify security vulnerabilities. Employ will provide
    summary reports of security test reports to Customer upon request."
  kind: contractual-commitment
  note: Reports are available to customers on request, not published.
