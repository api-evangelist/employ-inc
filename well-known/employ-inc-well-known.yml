description: >-
  Named-path probe of the RFC 8615 /.well-known/ namespace across every host in the Employ, Inc.
  record: the registrable domain and www, the corporate docs/marketing host, the Cloudflare-fronted
  careers host, the Pantheon marketing-page host, and the status host that serves the only
  machine-readable API surface Employ publishes off the corporate domain. NO PATH ON ANY HOST
  EMPLOY CONTROLS RETURNED A REAL DOCUMENT. This file records that absence; it is deliberately NOT
  wired to a WellKnown or SecurityTxt pointer in apis.yml, because those pointers assert that the
  provider serves the surface.
notes:
  - >-
    www.employinc.com and employinc.com are the same WordPress origin. Every /.well-known/ path
    returns HTTP 404 with the site's full HTML 404 template (~164KB), so the status code and the
    body agree: nothing is served.
  - >-
    pages.employinc.com answers HTTP 200 with the identical 295,796-byte marketing HTML page for
    EVERY path probed, including /openapi.json and /.well-known/agent-card.json. This is a catch-all
    SPA/landing-page shell, not a document. Scored as a miss on every path.
  - >-
    careers.employinc.com sits behind a Cloudflare interstitial ("Just a moment...") and returns
    HTTP 403 to a non-browser client on every path. This is an edge bot policy, not a statement
    about what the host serves; nothing is claimed either way.
  - >-
    status.employinc.com DOES return HTTP 200 for /.well-known/security.txt, but the document is
    NOT Employ's. It is Atlassian's, served by the Statuspage platform that hosts the page: the
    contacts are security@atlassian.com and atlassian.com/trust, and the file carries
    "Canonical: https://www.atlassian.com/.well-known/security.txt". It is recorded here for
    completeness and explicitly NOT credited to Employ, Inc. No SecurityTxt pointer is emitted.
